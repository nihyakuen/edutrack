services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: edutrack_dev
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "1505:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d edutrack_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edutrack_dev
      DB_USERNAME: admin
      DB_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: